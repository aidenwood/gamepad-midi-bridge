[project]
name = "gamepad-midi-bridge"
version = "2.1.0"
description = "PS5 / Xbox controller -> MIDI bridge with stick drift calibration. For VJs, music producers, and live performers."
authors = [{ name = "Aidxn Design", email = "aiden@rebuildrelief.com.au" }]
requires-python = ">=3.9"
readme = "README.md"
license = { text = "Proprietary" }

dependencies = [
    "PySide6>=6.7,<7",
    "pygame-ce>=2.5",
    "python-rtmidi>=1.5.8",
    "hidapi>=0.14",
    "cryptography>=42.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.5",
    "pyinstaller-hooks-contrib>=2024.7",
]
dev = [
    "ruff>=0.5",
    "pytest>=8",
]

[project.scripts]
gamepad-midi-bridge = "gamepad_midi_bridge.__main__:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gamepad_midi_bridge = [
    "resources/*",
    "resources/presets/*.json",
    "ui/*.qss",
    "connectors/templates/*",
    "connectors/templates/**/*",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
