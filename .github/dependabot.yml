version: 2

# Monthly dep updates for the two ecosystems this repo cares about:
#   - pip (pyproject.toml dependency pins)
#   - github-actions (action versions in .github/workflows/*.yml)
#
# Capped at 2 open PRs per ecosystem to keep CI minutes (and brain cycles) low.

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "08:00"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps"
      include: scope

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      day: monday
      time: "08:00"
      timezone: "Australia/Brisbane"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
