name: test

# Runs pytest on every push to main and every pull request.
# Single Python version (3.11) keeps minutes down; 3.9 forward-compat is
# enforced separately by ruff's `target-version = "py39"` in pyproject.toml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't cancel other OSes when one fails — we want full signal across
      # macOS / Windows / Linux for a desktop app that ships to all three.
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # Built-in pip cache keyed on the resolved interpreter + pyproject hash.
          cache: pip
          cache-dependency-path: pyproject.toml

      # python-rtmidi has no manylinux wheel that covers every distro, so on
      # Linux we need ALSA headers to compile from source. macOS/Windows ship
      # wheels on PyPI for arm64 + x86_64 so no system deps required.
      - name: Install ALSA headers (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install project (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,build]"

      # `pytest` is on PATH after installing the dev extra — use it directly
      # rather than `python -m pytest` for slightly faster startup and clearer
      # logs. `-q` keeps output tight; `--color=yes` re-enables colour in CI.
      - name: Run pytest
        run: pytest -q --color=yes tests/
