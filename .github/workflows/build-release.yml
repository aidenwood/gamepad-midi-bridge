name: build-release

# Triggers on MAJOR or MINOR semver tags (v2.0.0, v2.1.0, v3.0.0, ...).
# Patch releases (v2.0.1, v2.1.3) are skipped — we only pay GitHub for
# full 3-OS builds at MINOR milestones and above. workflow_dispatch is
# available to manually fire a build for any tag (e.g. a quick hotfix).
#
# Example: `git tag v2.1.0 && git push origin v2.1.0`
#
# Builds the PyInstaller bundle on each OS, uploads per-OS zips as artifacts,
# then a final job assembles a GitHub Release with all three zips attached.
#
# CI minute budget:
# - Tag pushes build all three OS (real release).
# - Manual dispatch defaults to macOS-only — most bug-fix iterations are
#   mac-specific and Windows runners cost 2× while macOS costs 10× per
#   minute, so skipping Windows + Linux saves a lot while iterating.
#   Flip `build_all_os` to "true" on dispatch to build everything (e.g.
#   when validating a cross-platform change before a real tag).

on:
  push:
    tags:
      - "v*.*.0"
  workflow_dispatch:
    inputs:
      build_all_os:
        description: "Build Windows + Linux too? (default: macOS only)"
        type: boolean
        default: false

# GITHUB_TOKEN is provided automatically by Actions; `contents: write` is
# required for softprops/action-gh-release to create the release + upload assets.
permissions:
  contents: write

jobs:
  # Compute the OS matrix dynamically so workflow_dispatch can default to
  # macOS-only while tag pushes still build all three. GitHub Actions does
  # not allow `matrix` context in a job-level `if:`, so we have to vary the
  # matrix itself rather than skip entries.
  setup:
    name: pick OS targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BUILD_ALL: ${{ github.event.inputs.build_all_os }}
        run: |
          if [ "$EVENT" = "push" ] || [ "$BUILD_ALL" = "true" ]; then
            echo 'matrix={"include":[{"os":"macos-latest","asset_suffix":"macos"},{"os":"windows-latest","asset_suffix":"windows"},{"os":"ubuntu-latest","asset_suffix":"linux"}]}' >> "$GITHUB_OUTPUT"
          else
            echo 'matrix={"include":[{"os":"macos-latest","asset_suffix":"macos"}]}' >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.os }})
    needs: setup
    runs-on: ${{ matrix.os }}
    # Hard ceiling so a stuck runner can't eat the monthly minute budget.
    # macOS at 10× the multiplier is the costliest stall — 25 min of wall
    # time = 250 billable minutes worst case, vs ~150 for a normal run.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      # ALSA headers required to build python-rtmidi from source on Linux.
      # Wheels exist for macOS (arm64 + x86_64) and Windows so no system deps needed there.
      - name: Install ALSA headers (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install project + build extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"

      - name: Run PyInstaller via build.py
        run: python build.py

      # ---- Per-OS packaging ----
      # macOS: PyInstaller --windowed produces `dist/Universal Controller MIDI.app`
      # (a directory bundle). We zip the .app directly. `ditto` preserves the
      # bundle's resource forks + symlinks correctly; plain `zip -r` can mangle them.
      #
      # CODE SIGNING: not done here. To add later:
      #   1. Add APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD, APPLE_TEAM_ID,
      #      APPLE_NOTARY_USER, APPLE_NOTARY_PASSWORD to repo secrets.
      #   2. Before `python build.py`: decode the .p12 into a temp keychain,
      #      `security import`, then pass `--codesign-identity` to PyInstaller
      #      (or run `codesign --deep --options runtime` post-build).
      #   3. After zipping: `xcrun notarytool submit ... --wait` + `xcrun stapler staple`.
      - name: Zip macOS .app
        if: runner.os == 'macOS'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Universal Controller MIDI.app" "../gamepad-midi-bridge-${TAG}-macos.zip"

      # Windows: --windowed (without --onefile, which our build.py omits on Windows)
      # produces a folder `dist/Universal Controller MIDI/` containing the .exe + deps.
      # We zip the whole folder so users get a self-contained app directory.
      - name: Zip Windows folder
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          Compress-Archive -Path "dist/Universal Controller MIDI" -DestinationPath "gamepad-midi-bridge-$env:TAG-windows.zip"

      # Actually LAUNCH the thing before we ship it. v2.1.5 went out with a
      # Windows binary no human or machine had ever run — CI compiled it, zipped
      # it, and published it. A missing hidden import or an unloadable DLL would
      # have reached paying customers as a silent flash-and-vanish.
      #
      # `--demo` uses the synthetic controller so no hardware is needed. We give
      # it 40s to get through Qt init, theme load, the SDL pump timer and first
      # paint; if it is still alive it got past every import and constructed the
      # main window. No `${{ }}` interpolation in this script on purpose.
      - name: Smoke-test the Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist\Universal Controller MIDI\Universal Controller MIDI.exe"
          if (-not (Test-Path $exe)) { throw "Built exe not found at $exe" }

          $data     = Join-Path $env:APPDATA "Universal Controller MIDI"
          $crashDir = Join-Path $data "crashes"
          $log      = Join-Path $data "logs\app.log"
          if (Test-Path $crashDir) { Remove-Item "$crashDir\*" -Force -ErrorAction SilentlyContinue }
          if (Test-Path $log)      { Remove-Item $log -Force -ErrorAction SilentlyContinue }

          Write-Host "Launching $exe --demo"
          $p = Start-Process -FilePath $exe -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 40

          $exited = $p.HasExited
          if (-not $exited) {
            Write-Host "Still running after 40s - startup OK."
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 3
          }

          if (Test-Path $log) {
            Write-Host "---- app.log (tail) ----"
            Get-Content $log -Tail 120
          } else {
            Write-Host "No app.log was written."
          }

          $crashes = @(Get-ChildItem $crashDir -Filter *.txt -ErrorAction SilentlyContinue)
          if ($crashes.Count -gt 0) {
            Write-Host "---- crash report ----"
            Get-Content $crashes[0].FullName
            throw "App produced a crash report on startup."
          }

          if ($exited) {
            throw "App exited within 40s (exit code $($p.ExitCode)) - it should still be running."
          }

          if (Test-Path $log) {
            if (Select-String -Path $log -Pattern "Traceback|CRITICAL" -Quiet) {
              throw "Traceback or CRITICAL found in app.log on a clean startup."
            }
          }
          Write-Host "Windows smoke test passed."

      # Linux: --onefile produces a single binary `dist/Universal Controller MIDI`.
      # Zip it so the asset name + extension stay consistent across OSes.
      - name: Zip Linux binary
        if: runner.os == 'Linux'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          zip "../gamepad-midi-bridge-${TAG}-linux.zip" "Universal Controller MIDI"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamepad-midi-bridge-${{ matrix.asset_suffix }}
          path: gamepad-midi-bridge-*-${{ matrix.asset_suffix }}.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only ever publish from a tag. Dispatching this workflow on `main` used to
    # reach here with `github.ref_name == "main"`, which would cut a release
    # literally named "main" and — worse — hand that string to
    # publish-to-storefront as the tag, overwriting the live `current` manifest
    # so midi.aidxn.com advertised a non-existent "main" build. This guard is
    # what makes a no-publish verification run (dispatch on a branch) safe.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # Download all three per-OS artifacts into a single folder. v4 changed
      # behaviour: omitting `name` downloads every artifact, each into its own
      # subdir. We flatten with `merge-multiple: true`.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List collected assets
        run: ls -la release-assets

      # Creates the release for the pushed tag and attaches every zip in the
      # folder. `generate_release_notes: true` makes GitHub auto-build notes
      # from merged PRs since the last tag — saves us writing them manually.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Push the same per-OS zips into the storefront's Netlify Blobs so
  # midi.aidxn.com/downloads serves them automatically. Runs in parallel
  # with the GitHub Release job (no `needs: release` - they are independent).
  #
  # Required repo secret: NETLIFY_AUTH_TOKEN (Personal Access Token with
  # Blobs write scope). Get one at:
  #   https://app.netlify.com/user/applications#personal-access-tokens
  # Optional repo secret: STOREFRONT_SITE_ID (defaults to the production
  # storefront site id hardcoded in scripts/publish-to-storefront.mjs).
  #
  # Safe-input note: every dynamic value (tag name, repo name) reaches the
  # publish script via env vars, not via shell interpolation in `run:` -
  # follows GitHub's workflow-injection mitigation guidance.
  publish-storefront:
    name: publish to storefront (Netlify Blobs)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Skip cleanly when running on a fork / before secrets are wired in, and
    # never publish from a branch — see the guard on the `release` job above for
    # why a dispatch on `main` must not reach the storefront manifest.
    if: ${{ github.repository == 'aidenwood/gamepad-midi-bridge' && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Netlify Blobs SDK
        run: npm install --no-save @netlify/blobs@^10

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish artefacts to storefront Blobs
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          STOREFRONT_SITE_ID: ${{ secrets.STOREFRONT_SITE_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          ARTEFACT_DIR: release-assets
        run: node scripts/publish-to-storefront.mjs
